[package]
name = "stereocord"
version = "1.0.0"
edition = "2021"
description = "Signature-based stereo / high-bitrate patcher for Discord's Linux voice module"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/DasPauluteli/stereocord"

[[bin]]
name = "stereocord"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

[profile.release]
opt-level = 2
strip = true
